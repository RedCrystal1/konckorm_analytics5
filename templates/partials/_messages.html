{% if messages %}
{% for message in messages %}
<div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show d-flex align-items-center" role="alert">
    {% if message.tags == 'success' %}<i class="bi bi-check-circle-fill me-2 fs-5"></i>
    {% elif message.tags == 'error' or message.tags == 'danger' %}<i class="bi bi-exclamation-circle-fill me-2 fs-5"></i>
    {% elif message.tags == 'warning' %}<i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
    {% else %}<i class="bi bi-info-circle-fill me-2 fs-5"></i>
    {% endif %}
    <div>{{ message }}</div>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
{% endfor %}
{% endif %}
