version: "3.9"

# Для разработки: docker compose -f docker/docker-compose.dev.yml up
# Горячая перезагрузка, debug toolbar, SQLite fallback

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ..:/app                       # Монтируем исходники для hot-reload
      - dev_static:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - DJANGO_DEBUG=1
      - DB_NAME=konckorm_db
      - DB_USER=konckorm
      - DB_PASSWORD=devpassword
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    volumes:
      - dev_postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: konckorm_db
      POSTGRES_USER: konckorm
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U konckorm -d konckorm_db"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A config worker -l debug --concurrency=2
    volumes:
      - ..:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - DB_NAME=konckorm_db
      - DB_USER=konckorm
      - DB_PASSWORD=devpassword
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      - db
      - redis
    restart: unless-stopped

  celery_beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ..:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - DB_NAME=konckorm_db
      - DB_USER=konckorm
      - DB_PASSWORD=devpassword
      - DB_HOST=db
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - db
      - redis
    restart: unless-stopped

volumes:
  dev_postgres:
  dev_static:
