{% load humanize %}
<canvas id="debtChart" height="300"></canvas>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const ctx = document.getElementById('debtChart');
    if (!ctx) return;

    const dates = [{% for s in history %}"{{ s.date|date:'Y-m-d' }}"{% if not forloop.last %},{% endif %}{% endfor %}];

    new Chart(ctx, {
        type: 'line',
        data: {
            labels: [{% for s in history %}"{{ s.date|date:'d.m' }}"{% if not forloop.last %},{% endif %}{% endfor %}],
            datasets: [{
                label: 'Общая КЗ',
                data: [{% for s in history %}{{ s.total_debt }}{% if not forloop.last %},{% endif %}{% endfor %}],
                borderColor: '#4472C4',
                backgroundColor: 'rgba(68,114,196,0.1)',
                fill: true, tension: 0.3, pointRadius: 4, pointHoverRadius: 7
            },{
                label: 'Просроченная КЗ',
                data: [{% for s in history %}{{ s.overdue_debt }}{% if not forloop.last %},{% endif %}{% endfor %}],
                borderColor: '#dc3545',
                backgroundColor: 'rgba(220,53,69,0.1)',
                fill: true, tension: 0.3, pointRadius: 4, pointHoverRadius: 7
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { position: 'bottom' },
                tooltip: {
                    callbacks: {
                        label: function(ctx) {
                            return ctx.dataset.label + ': ' + new Intl.NumberFormat('ru-RU').format(ctx.raw) + ' ₽';
                        },
                        footer: function() { return 'Нажмите для детализации'; }
                    }
                }
            },
            scales: { y: { beginAtZero: true, ticks: { callback: function(v) { return (v/1000).toFixed(0) + ' тыс.'; } } } },
            onClick: function(e, elements) {
                if (elements.length > 0) {
                    var idx = elements[0].index;
                    var dateStr = dates[idx];
                    window.location = '{% url "registers:debt_register" %}?date_to=' + dateStr;
                }
            },
            onHover: function(e, elements) {
                e.native.target.style.cursor = elements.length > 0 ? 'pointer' : 'default';
            }
        }
    });
});
</script>
