{% load humanize %}
<div class="chart-wrap" style="height:280px;padding:8px 12px;position:relative">
  <canvas id="debtChart"></canvas>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  if (typeof Chart === 'undefined') {
    console.warn('Chart.js ещё не загружен');
    return;
  }
  const ctx = document.getElementById('debtChart');
  if (!ctx) return;

  const dates = [{% for s in history %}"{{ s.date|date:'Y-m-d' }}"{% if not forloop.last %},{% endif %}{% endfor %}];
  const labels = [{% for s in history %}"{{ s.date|date:'d.m' }}"{% if not forloop.last %},{% endif %}{% endfor %}];
  const total  = [{% for s in history %}{{ s.total_debt }}{% if not forloop.last %},{% endif %}{% endfor %}];
  const overdue = [{% for s in history %}{{ s.overdue_debt }}{% if not forloop.last %},{% endif %}{% endfor %}];

  // Градиенты под линии
  const ctx2d = ctx.getContext('2d');
  const g1 = ctx2d.createLinearGradient(0, 0, 0, 280);
  g1.addColorStop(0, 'rgba(37, 99, 235, 0.18)');
  g1.addColorStop(1, 'rgba(37, 99, 235, 0)');
  const g2 = ctx2d.createLinearGradient(0, 0, 0, 280);
  g2.addColorStop(0, 'rgba(220, 38, 38, 0.18)');
  g2.addColorStop(1, 'rgba(220, 38, 38, 0)');

  new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [
        {
          label: 'Общая КЗ',
          data: total,
          borderColor: '#2563eb',
          backgroundColor: g1,
          borderWidth: 1.8,
          tension: 0.35,
          fill: true,
          pointRadius: 0,
          pointHoverRadius: 4,
          pointHoverBackgroundColor: '#2563eb',
          pointHoverBorderColor: '#fff',
          pointHoverBorderWidth: 2,
        },
        {
          label: 'Просроченная КЗ',
          data: overdue,
          borderColor: '#dc2626',
          backgroundColor: g2,
          borderWidth: 1.8,
          tension: 0.35,
          fill: true,
          pointRadius: 0,
          pointHoverRadius: 4,
          pointHoverBackgroundColor: '#dc2626',
          pointHoverBorderColor: '#fff',
          pointHoverBorderWidth: 2,
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#18181b',
          titleColor: '#fff',
          bodyColor: '#d4d4d8',
          padding: 10,
          cornerRadius: 6,
          titleFont: { size: 11, weight: '600' },
          bodyFont: { size: 11 },
          borderColor: 'rgba(255,255,255,.08)',
          borderWidth: 1,
          callbacks: {
            label: function(c) {
              return c.dataset.label + ': ' + new Intl.NumberFormat('ru-RU').format(c.raw) + ' ₽';
            },
            footer: function() { return 'Клик → реестр'; }
          }
        }
      },
      scales: {
        x: {
          grid: { display: false },
          border: { display: false },
          ticks: { color: '#a1a1aa', font: { size: 10 } }
        },
        y: {
          beginAtZero: true,
          grid: { color: '#f1f1f1' },
          border: { display: false },
          ticks: {
            color: '#a1a1aa',
            font: { size: 10 },
            callback: v => (v / 1000).toFixed(0) + ' тыс.'
          }
        }
      },
      onClick: function(e, elements) {
        if (elements.length > 0) {
          const idx = elements[0].index;
          window.location = '{% url "registers:debt_register" %}?date_to=' + dates[idx];
        }
      },
      onHover: function(e, elements) {
        e.native.target.style.cursor = elements.length > 0 ? 'pointer' : 'default';
      }
    }
  });
});
</script>
