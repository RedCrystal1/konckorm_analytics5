{% load humanize %}
<table class="table table-sm">
<thead><tr><th>Дата</th><th>Сумма</th><th>Просрочка</th><th>Дней</th><th>Статус</th></tr></thead>
<tbody>
{% for r in records %}
<tr><td>{{ r.record_date|date:"d.m.Y" }}</td><td>{{ r.amount_rub|floatformat:0|intcomma }}</td>
<td>{{ r.overdue_amount|floatformat:0|intcomma }}</td><td>{{ r.overdue_days }}</td><td>{{ r.get_status_display }}</td></tr>
{% empty %}<tr><td colspan="5" class="text-muted">Нет данных</td></tr>{% endfor %}
</tbody></table>
