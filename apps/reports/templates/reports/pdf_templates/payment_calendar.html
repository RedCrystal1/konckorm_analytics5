<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
body{font-family:sans-serif;font-size:12px;}table{width:100%;border-collapse:collapse;margin-top:10px;}
th,td{border:1px solid #999;padding:4px 6px;}th{background:#4472C4;color:#fff;}h1{font-size:16px;}
</style></head><body>
<h1>Платёжный календарь</h1>
<table><thead><tr><th>Дата</th><th>Контрагент</th><th>Сумма</th><th>Приоритет</th><th>Статус</th></tr></thead>
<tbody>{% for p in payments %}
<tr><td>{{ p.planned_date|date:"d.m.Y" }}</td><td>{{ p.counterparty.name }}</td><td>{{ p.amount }}</td>
<td>{{ p.get_priority_display }}</td><td>{{ p.get_status_display }}</td></tr>
{% endfor %}</tbody></table></body></html>
