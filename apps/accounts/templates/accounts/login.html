<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — КонцКорма.Аналитика</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        * { font-family: 'Inter', 'Segoe UI', sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a3a5c 0%, #2c5aa0 50%, #4a7fd4 100%);
        }
        .login-container { width: 100%; max-width: 420px; padding: 1rem; }
        .login-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, #1a3a5c, #2c5aa0);
            padding: 2rem;
            text-align: center;
            color: #fff;
        }
        .login-header h4 { font-weight: 700; margin-bottom: 0.25rem; }
        .login-header p { opacity: 0.7; font-size: 0.9rem; margin: 0; }
        .login-body { padding: 2rem; }
        .login-icon {
            width: 56px; height: 56px;
            background: rgba(255,255,255,0.15);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1rem;
            font-size: 1.5rem;
        }
        .form-control {
            border-radius: 8px;
            padding: 0.65rem 0.85rem;
            border: 1px solid #cbd5e1;
        }
        .form-control:focus {
            border-color: #4a7fd4;
            box-shadow: 0 0 0 3px rgba(44,90,160,0.12);
        }
        .btn-login {
            background: linear-gradient(135deg, #2c5aa0, #1a3a5c);
            border: none;
            border-radius: 8px;
            padding: 0.7rem;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 4px 12px rgba(44,90,160,0.4);
            transition: all 0.2s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(44,90,160,0.5);
        }
        .footer-text {
            text-align: center;
            color: rgba(255,255,255,0.5);
            font-size: 0.75rem;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">
                    <i class="bi bi-bar-chart-fill"></i>
                </div>
                <h4>КонцКорма<span style="opacity:0.7">.Аналитика</span></h4>
                <p>Платформа учёта взаиморасчётов</p>
            </div>
            <div class="login-body">
                {% if form.errors %}
                <div class="alert alert-danger d-flex align-items-center py-2" style="border-radius:8px;font-size:0.85rem">
                    <i class="bi bi-exclamation-circle me-2"></i>
                    Неверный логин или пароль
                </div>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold" style="font-size:0.85rem;color:#475569">Имя пользователя</label>
                        {{ form.username }}
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold" style="font-size:0.85rem;color:#475569">Пароль</label>
                        {{ form.password }}
                    </div>
                    <button type="submit" class="btn btn-primary btn-login w-100">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Войти
                    </button>
                    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
                </form>
            </div>
        </div>
        <div class="footer-text">
            &copy; 2026 АО «Концкорма» — Все права защищены
        </div>
    </div>
</body>
</html>
