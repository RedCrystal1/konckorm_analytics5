<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — КонцКорма.Аналитика</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
      :root {
        --bg: #fafafa;
        --surface: #ffffff;
        --surface-2: #f5f5f5;
        --border: #e8e8e8;
        --border-2: #d4d4d8;
        --text: #18181b;
        --text-2: #52525b;
        --text-3: #a1a1aa;
        --accent: #2563eb;
        --bad: #dc2626;
        --bad-soft: #fef2f2;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 13.5px;
        background: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .lg-card {
        width: 100%;
        max-width: 380px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 10px 40px rgba(0,0,0,.04);
        overflow: hidden;
      }
      .lg-h {
        padding: 28px 28px 14px;
        text-align: center;
      }
      .lg-icon {
        width: 40px;
        height: 40px;
        background: #0a0a0a;
        color: #fff;
        border-radius: 10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 16px;
        margin-bottom: 14px;
      }
      .lg-h h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -.02em;
      }
      .lg-h h1 span {
        color: var(--text-3);
        font-weight: 500;
      }
      .lg-h p {
        margin: 4px 0 0;
        font-size: 12px;
        color: var(--text-2);
      }
      .lg-body {
        padding: 14px 28px 28px;
      }
      .lg-error {
        background: var(--bad-soft);
        border: 1px solid #fecaca;
        color: #7f1d1d;
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 12px;
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .lg-field { margin-bottom: 12px; }
      .lg-field label {
        display: block;
        font-size: 11.5px;
        font-weight: 500;
        color: var(--text-2);
        margin-bottom: 4px;
      }
      .lg-field input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 13px;
        font-family: inherit;
        color: var(--text);
        background: var(--surface);
        transition: all .15s;
      }
      .lg-field input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(37,99,235,.12);
        outline: none;
      }
      .lg-btn {
        width: 100%;
        background: var(--text);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-family: inherit;
        transition: background .12s;
      }
      .lg-btn:hover { background: #000; }
      .lg-foot {
        text-align: center;
        font-size: 11px;
        color: var(--text-3);
        margin-top: 18px;
      }
    </style>
</head>
<body>
    <div>
      <div class="lg-card">
        <div class="lg-h">
          <div class="lg-icon">К</div>
          <h1>КонцКорма<span>.Аналитика</span></h1>
          <p>Платформа учёта взаиморасчётов</p>
        </div>
        <div class="lg-body">
          {% if form.errors %}
          <div class="lg-error">
            <i class="bi bi-exclamation-circle"></i>
            Неверный логин или пароль
          </div>
          {% endif %}
          <form method="post">
            {% csrf_token %}
            <div class="lg-field">
              <label for="id_username">Имя пользователя</label>
              {{ form.username }}
            </div>
            <div class="lg-field">
              <label for="id_password">Пароль</label>
              {{ form.password }}
            </div>
            <button type="submit" class="lg-btn">
              <i class="bi bi-box-arrow-in-right"></i> Войти
            </button>
            {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
          </form>
        </div>
      </div>
      <div class="lg-foot">© 2026 АО «Концкорма»</div>
    </div>
    <script>
      // Применяем стиль к Django-инпутам формы
      document.querySelectorAll('.lg-field input').forEach(i => {
        i.style.width = '100%';
      });
    </script>
</body>
</html>
