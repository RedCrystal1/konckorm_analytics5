{% load humanize %}
<table class="table table-hover table-sm">
<thead><tr><th>Номер</th><th>Дата</th><th>Контрагент</th><th class="text-end">Сумма</th></tr></thead>
<tbody>
{% for doc in documents %}
<tr><td>{{ doc.number }}</td><td>{{ doc.date|date:"d.m.Y" }}</td><td>{{ doc.counterparty.name|truncatechars:30 }}</td><td class="text-end">{{ doc.amount|floatformat:0|intcomma }}</td></tr>
{% empty %}<tr><td colspan="4" class="text-muted text-center">Нет документов</td></tr>{% endfor %}
</tbody></table>
{% include "partials/_pagination.html" %}
